name: Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE_APP: ${{ vars.ECS_SERVICE_APP }}
  ECS_SERVICE_WORKER: ${{ vars.ECS_SERVICE_WORKER }}
  TASK_DEFINITION_APP: ${{ vars.TASK_DEFINITION_APP }}
  TASK_DEFINITION_WORKER: ${{ vars.TASK_DEFINITION_WORKER }}
  CONTAINER_NAME: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       --target release \
                       -f docker/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run DB migrations via ECS run-task
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition $TASK_DEFINITION_APP --query taskDefinition)
          OVERRIDES=$(cat <<EOF
          {
            "containerOverrides": [{
              "name": "$CONTAINER_NAME",
              "command": ["php", "artisan", "migrate", "--force"]
            }]
          }
          EOF
          )
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition $TASK_DEFINITION_APP \
            --launch-type FARGATE \
            --network-configuration "$(aws ecs describe-services --cluster $ECS_CLUSTER --services $ECS_SERVICE_APP --query 'services[0].networkConfiguration' --output json)" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "Waiting for migration task $TASK_ARN..."
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN
          EXIT_CODE=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Update ECS app service
        id: deploy-app
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_APP }}
          service: ${{ env.ECS_SERVICE_APP }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-ids: containerName=${{ env.CONTAINER_NAME }},imageUri=${{ steps.build-image.outputs.image }}

      - name: Update ECS worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_WORKER }}
          service: ${{ env.ECS_SERVICE_WORKER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          image-ids: containerName=${{ env.CONTAINER_NAME }},imageUri=${{ steps.build-image.outputs.image }}
